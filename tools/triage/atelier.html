<script>

  ['genoux', 'Genoux', 'knees together'], ['mains', 'Mains', 'right hand in her hair'], ['regard', 'Regard', 'looking over her shoulder'], ['contact', 'Contact', 'her cheek against the pillow']];

}
const noteCourte = n => { const x = (D.notes || {})[n]; return x && x.score >= 0 ? `<span class="${x.score <= 4 ? 'err' : x.score <= 6 ? 'avt' : 'okc'}">${x.score}</span>` : '<span class="mut">·</span>'; };
const VERDICTS = [['ok', 'Bonne'], ['passable', 'Passable'], ['pose', 'Position moyenne'], ['ton', 'Pas dans le ton'], ['tenue', 'Tenue fausse'], ['geste', 'Geste absent'], ['objet', 'Objet en trop'], ['visage', 'Visage'], ['corps', 'Corps'], ['decor', 'Décor'], ['cadrage', 'Cadrage']];
const QUOI = {1: 'Tous publics, pour les réseaux : elle donne envie de voir la suite. Le rédacteur IA peut l\'écrire, la relire et l\'analyser.',
  2: 'Suggestif poussé : lingerie, nu suggéré, rien d\'explicite. Offert ou réservé aux abonnés, c\'est le temps qui convertit. Le rédacteur IA peut l\'écrire, sauf les scènes qui portent des LoRA.',

const CONSIGNES_T2 = ['Plus lente, plus intime', 'Plus près de la caméra', 'Tenue plus défaite, toujours suggestif', 'Fin qui annonce mieux la suite payante'];
const depotHtml = x => `<div class="var"><b>${esc(x.titre || x.fichier)}</b> <span class="mut">${esc(x.fichier)}, ${esc(x.date)}</span>

const CONSIGNES = ['Plus aguicheur, plus de tension', 'Accroche plus forte dès la première seconde', 'Coupe plus frustrante à la fin', 'Plus drôle, plus d\'autodérision', 'Autre lieu, autre tenue', 'Plus court'];
const CONSIGNES_SCENE = ['Plus sensuelle, toujours suggestive', 'Plus près de la caméra', 'Geste plus simple et plus lent', 'Texte à l\'écran plus percutant', 'Autre tenue'];

let C = null, cT = null;

  const sel = (k, l) => `<select data-cm="${k}">${l.map(([v, lab]) => `<option value="${esc(v)}" ${String(v) === String(CM[k]) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;

  const rang = (titre, l) => `<div class="mut" style="margin-top:6px"><b>${titre}</b></div>${l.length ? `<div class="bgal cm">${l.map(f => `<a href="${u(f)}" target="_blank"><img loading="lazy" src="${u(f)}" alt=""></a>`).join('')}</div>` : '<div class="mut">Pas encore d\'image.</div>'}`;

    <h2>Comparer les deux méthodes</h2>
    <p class="mut">Les mêmes scènes sont fabriquées deux fois, avec le même tirage au sort et les mêmes LoRA. En haut, la méthode actuelle : le lieu et la tenue viennent du texte. En bas, la nouvelle : le lieu et la tenue viennent des images de l'atelier du personnage. Rien ne change dans le projet : ces images restent sur cette page.</p>
    <div class="panel">

// Zones qui changent pendant un calcul : rendues a part pour ne pas toucher aux champs en cours de saisie.
function majDyn() {
  const set = (el, html, k) => { if (el && sig[k] !== html) { sig[k] = html; el.innerHTML = html; } };
  const i = ETAPES.findIndex(e => e[0] === D.etape);
  set($('#etapes'), ETAPES.map((e, j) => `<span class="${j < i ? 'done' : j === i ? 'cur' : ''}">${e[1]}</span>`).join(''), 'etapes');
  const SCT = P.scenes.filter(s => s.temps === T);
  const rq = (D.controle || {})[T] || [], nSc = sid => P.scenes.filter(s => s.temps === T).findIndex(s => s.id === sid) + 1;
  set($('#controle'), `${ic('controle')} <b>Contrôle des plans</b> <span class="mut">avant de payer un calcul</span>` + (rq.length
    ? `<ul class="rq">${rq.map(x => `<li class="${x.grave ? 'err' : ''}">${x.scene ? `<b>Scène ${nSc(x.scene)}</b> : ` : ''}${esc(x.msg)}</li>`).join('')}</ul>`
    : `<div class="okc">Aucune remarque.</div>`), 'controle');
  const c = D.chaine, occ = D.prod.etat === 'en cours' || c.etat === 'en cours', actif = c.etat === 'en cours' || c.etat === 'pause';
  const ETATS = {'en cours': 'Chaîne en cours', pause: 'Chaîne en pause', termine: 'Chaîne terminée', arretee: 'Chaîne arrêtée', erreur: 'Chaîne en erreur'};
  (pt => { if (pt) pt.className = actif || c.etat === 'erreur' ? 'pt ' + (c.etat === 'pause' ? 'avt' : c.etat === 'erreur' ? 'err' : '') : ''; })($('#ptch'));
  set($('#chaine'), `<div class="mut">Tout le projet : images, clips, montage, un temps après l'autre.</div><div class="aide">Ne calcule que ce qui manque. Un devis est affiché avant tout lancement.</div>
    <div class="row">${NT.map(t => `<label class="c"><input type="checkbox" data-ch="t${t}" ${CH['t' + t] ? 'checked' : ''} ${actif ? 'disabled' : ''}>${t}. ${TEMPS[t][0]} (${P.scenes.filter(x => x.temps === t).length})</label>`).join('')}</div>

// Banc : au choix d'une LoRA, la phrase demarre avec ses mots declencheurs et sa page d'origine est relue chez la source
async function bancOrigine(n) {
  const x = n && E.bibliotheque.loras.find(y => y.name === n);
  if (!x || !x.source || AB.orig[n] || bancOrigine.att[n]) return;
  bancOrigine.att[n] = 1;
  try { AB.orig[n] = await api('/api/h/origine?name=' + encodeURIComponent(n)); } catch (e) { AB.orig[n] = {erreur: e.message, mots: [], exemples: []}; }
  delete bancOrigine.att[n];
  if (AB.lora === n && AO === 'banc') rendreAtelier();
}
