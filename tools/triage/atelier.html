<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .scene { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .scene .sh { display:flex; gap:6px; align-items:center; }
  .scene .sh b { width:24px; height:24px; border-radius:12px; background:var(--acc-bg); color:var(--acc); text-align:center; flex:none; font-size:13px; line-height:24px; }
  .scene .sh input { margin:0; flex:1; min-width:0; }
  .media { display:flex; gap:10px; margin-top:10px; }
  .media .pv { width:112px; aspect-ratio:9/16; background:var(--fond); border-radius:6px; overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:12px; text-align:center; }
  .media .pv img, .media .pv video { width:100%; height:100%; object-fit:cover; display:block; }
  .media .side { flex:1; min-width:0; }
  .takes { display:flex; gap:5px; overflow-x:auto; margin:4px 0 8px; }
  .takes img { width:36px; height:64px; object-fit:cover; border-radius:4px; border:2px solid transparent; flex:none; cursor:pointer; opacity:.6; }
  .takes img.on { border-color:var(--acc); opacity:1; }
  .takes button.on { border-color:var(--acc); color:var(--acc); }
  video.fin { width:100%; max-width:300px; border-radius:8px; display:block; margin:8px auto; background:#000; }
  .ver { display:flex; gap:8px; align-items:center; padding:4px 0; font-size:14px; }
</style></head><body>
<header>
  <div class="l1"><a href="/">Studio</a><b>Atelier</b><span class="sp"></span><small id="sauve"></small><small id="redac"></small><small id="gpu"></small></div>
  <div class="chips" id="persos"></div>
  <div class="chips" id="onglets" style="display:none"></div>
</header>
<main id="vue"></main>
<script src="/ui.js"></script>
<script>
const vue = $('#vue');
let E = null, D = null, P = null, cur = localStorage.getItem('perso') || '', autoEcrire = '', timer = null, tSave = null, sig = {}, T = 1;
const ETAPES = [['idee', 'Idée'], ['ecrit', 'Scénario'], ['images', 'Images'], ['clips', 'Clips'], ['monte', 'Montage'], ['valide', 'Validée']];
const TEMPS = {1: ['Accroche', 'tous publics'], 2: ['Montée', 'suggestif'], 3: ['Dévoilé', 'nu, sans acte'], 4: ['Final', 'explicite']}, NT = [1, 2, 3, 4];
const QUOI = {1: 'Tous publics, pour les réseaux : elle donne envie de voir la suite. Le rédacteur IA peut l\'écrire, la relire et l\'analyser.',
  2: 'Suggestif poussé : lingerie, nu suggéré, rien d\'explicite. Offert ou réservé aux abonnés, c\'est le temps qui convertit. Le rédacteur IA peut l\'écrire, sauf les scènes qui portent des LoRA.',
  3: 'Nudité explicite, sans acte. Pour l\'abonnement ou un paiement bas. Ce temps est à votre main : le rédacteur IA ne l\'écrit pas, ne le relit pas et ne l\'analyse pas.',
  4: 'Explicite, avec actes. Vendu à l\'unité. Ce temps est à votre main : le rédacteur IA ne l\'écrit pas, ne le relit pas et ne l\'analyse pas.'};
const CONSIGNES_T2 = ['Plus lente, plus intime', 'Plus près de la caméra', 'Tenue plus défaite, toujours suggestif', 'Fin qui annonce mieux la suite payante'];
const depotHtml = x => `<div class="var"><b>${esc(x.titre || x.fichier)}</b> <span class="mut">${esc(x.fichier)}, ${esc(x.date)}</span>
  ${x.erreur ? `<div class="err">Refusé : ${esc(x.erreur)}</div>` : `<div class="mut">${x.n} plan(s) pour le temps ${x.temps}${x.projet ? '' : ', nouveau projet'}${x.perime ? ' ; écrit d\'après un modèle périmé' : ''}${x.remarques ? ` ; ${x.remarques} remarque(s) au contrôle des plans` : ''}${x.note ? ' ; ' + esc(x.note) : ''}</div>
  <div class="row" style="margin-top:6px">${x.importe ? '<span class="okc">Importé</span>' : `<button class="p s" data-a="importer" data-n="${esc(x.fichier)}">${ic('importer')}${x.change ? 'Réimporter (fichier modifié)' : 'Importer dans le projet'}</button>`}</div>`}</div>`;
const CONSIGNES = ['Plus aguicheur, plus de tension', 'Accroche plus forte dès la première seconde', 'Coupe plus frustrante à la fin', 'Plus drôle, plus d\'autodérision', 'Autre lieu, autre tenue', 'Plus court'];
const CONSIGNES_SCENE = ['Plus sensuelle, toujours suggestive', 'Plus près de la caméra', 'Geste plus simple et plus lent', 'Texte à l\'écran plus percutant', 'Autre tenue'];

// --- Etat general, barre du haut -------------------------------------------------------------------
async function etat() {
  E = await api('/api/a/etat');
  const actifs = E.personnages.filter(p => p.statut !== 'archive');
  if (!actifs.some(p => p.slug === cur)) cur = actifs[0]?.slug || '';
  $('#persos').innerHTML = actifs.map(p => `<span class="chip ${p.slug === cur ? 'on' : ''}" data-slug="${esc(p.slug)}">${esc(p.nom)}</span>`).join('')
    + `<span class="chip" data-h="#/persos">${ic('personnage')} Personnages</span><span class="chip" data-h="#/loras">${ic('lora')} LoRA</span>`;
  $('#gpu').textContent = E.depense ? `GPU ${usd(E.depense.jour)} / ${usd(E.depense.plafond)}` : '';
  $('#redac').innerHTML = E.redacteur ? '<span class="okc">Rédacteur IA</span>' : '<span style="color:var(--warn)">Rédacteur de secours</span>';
}
$('#persos').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.dataset.h) return location.hash = c.dataset.h;
  cur = c.dataset.slug; localStorage.setItem('perso', cur);
  if (location.hash === '#/' || !location.hash) route(); else location.hash = '#/';
};
$('#onglets').onclick = e => { const b = e.target.closest('[data-t]'); if (b && P) essai(actions.temps)(b); };  // les temps du projet ouvert
const perso = () => E.personnages.find(p => p.slug === cur);

// --- Routage ---------------------------------------------------------------------------------------
async function route() {
  clearInterval(timer); timer = null;
  if (P) await sauver();
  D = P = null; sig = {};
  $('#onglets').style.display = 'none'; $('#persos').style.display = '';
  const h = location.hash.slice(2).split('/');
  try {
    await etat();
    if (h[0] === 'p' && h[1]) await ouvrirProjet(h[1]);
    else if (h[0] === 'persos') vuePersos();
    else if (h[0] === 'loras') vueLoras();
    else if (h[0] === 'perso') await vuePerso(h[1] || '');
    else vueProjets();
  } catch (e) { vue.innerHTML = `<p class="err">${esc(e.message)}</p><p><a href="#/">Retour</a></p>`; }
  window.scrollTo(0, 0);
}
window.onhashchange = route;

// --- Liste des projets -----------------------------------------------------------------------------
function vueProjets() {
  const p = perso();
  if (!p) return vue.innerHTML = '<p class="mut">Aucun personnage.</p><button class="p" onclick="location.hash=\'#/perso\'">Créer un personnage</button>';
  const liste = E.projets.filter(x => x.personnage === cur);
  const lab = Object.fromEntries(ETAPES);
  vue.innerHTML = `
    <div class="row tete"><button class="p" data-a="nouveau">${ic('ajouter')}Nouveau projet</button><button data-a="idees">${ic('idee')}Trouver des idées</button>
      <span class="sp"></span><a href="#/perso/${esc(cur)}">Fiche de ${esc(p.nom.split(' ')[0])}</a></div>
    ${p.lora ? '' : '<p class="mut">Ce personnage n\'a pas de LoRA : son visage variera d\'une image à l\'autre.</p>'}
    <div id="idees"></div>
    ${E.depots.length ? `<h2>Plans déposés par l'agent <small>sans projet</small></h2><div class="panel">${E.depots.map(depotHtml).join('')}</div>` : ''}
    <h2>Projets <small>${liste.length}, par date du personnage</small></h2>
    ${liste.map(x => `<a class="card" href="#/p/${x.id}">
      <div class="th" ${x.vignette ? `style="background-image:url('/afile/${x.id}/${esc(x.vignette)}')"` : ''}></div>
      <div><b>${esc(x.titre)}</b><span class="mut">${x.date_perso ? 'Elle le vit le ' + dfr(x.date_perso) : 'Sans date du personnage'}</span><span class="mut">${esc(x.pitch)}</span>
      <span class="badge ${x.etape === 'valide' ? 'v' : ''}">${lab[x.etape]}</span> <span class="mut">${x.scenes} scènes${x.temps.length > 1 ? ', temps ' + x.temps.join(' ') : ''}, modifié le ${esc(x.modifie || '')}</span></div></a>`).join('')
      || '<p class="mut">Aucune vidéo pour ce personnage. Commencer par « Trouver des idées ».</p>'}`;
}
async function creer(titre, brief) {
  const r = await api('/api/a/projet', {personnage: cur, titre, brief});
  if (brief) autoEcrire = r.projet.id;
  location.hash = '#/p/' + r.projet.id;
}
async function idees() {
  const theme = await demander('Idées de vidéos : un thème ? (facultatif)', ['Matin au lit', 'Après le sport', 'Soirée, tenue habillée', 'Salle de bain', 'Humour, raté du quotidien']);
  if (theme === null) return;
  const fin = r => {
    $('#idees').innerHTML = `<h2>Idées <small>${r.moteur === 'secours' ? 'structures types (rédacteur IA arrêté)' : 'classées de la plus vendeuse à la moins vendeuse'}</small></h2>`
      + r.resultat.idees.map((x, i) => `<div class="panel"><b>${esc(x.titre)}</b><div class="mut">${esc(x.pitch)}</div>
        <div style="margin-top:4px">« ${esc(x.accroche)} »</div><div class="row"><button class="p s" data-a="idee" data-i="${i}">${ic('ecrire')}Écrire cette vidéo</button></div></div>`).join('');
    idees.r = r.resultat.idees;
  };
  ecrire({kind: 'idees', personnage: cur, consigne: theme, n: 8}, fin, 'Recherche d\'idées');
}

// --- Ecriture --------------------------------------------------------------------------------------
async function ecrire(body, fin, msg) {
  if (P) await sauver();
  const r = await api('/api/a/ecrire', body);
  if (r.etat === 'pret') return fin(r);
  attendre(r.rid, fin, msg);
}
function attendre(rid, fin, msg) {
  busy(msg || 'Rédaction en cours');
  const t = setInterval(async () => {
    try {
      const r = await api('/api/a/ecrire?rid=' + rid);
      if (r.etat !== 'pret') return;
      clearInterval(t); busy(); fin(r);
    } catch (e) { clearInterval(t); busy(); toast(e.message); if (P) recharger(); }
  }, 2000);
}

// --- Projet ----------------------------------------------------------------------------------------
async function ouvrirProjet(id) {
  if (ouvrirProjet.id !== id) T = 1;
  ouvrirProjet.id = id;
  D = await api('/api/a/projet?id=' + id); P = D.projet;
  rendreProjet();
  if (P.attente) attendre(P.attente, recharger);
  else if (autoEcrire === id) { autoEcrire = ''; ecrire({kind: 'scenario', projet: id}, recharger, 'Écriture du scénario'); }
  surveiller();
}
async function recharger() {
  const y = window.scrollY;
  D = await api('/api/a/projet?id=' + P.id); P = D.projet; sig = {};
  rendreProjet(); window.scrollTo(0, y); surveiller(); etat();
}
function planifier() { $('#sauve').textContent = '...'; clearTimeout(tSave); tSave = setTimeout(essai(sauver), 900); }
async function sauver() {
  if (!P || !tSave) return;
  clearTimeout(tSave); tSave = null;
  const r = await api('/api/a/projet', P);
  $('#sauve').textContent = 'enregistré';
  if (r.controle && D) { D.controle = r.controle; majDyn(); }
}
async function structure(f) { f(); tSave = 1; await sauver(); await recharger(); }  // changement de structure : enregistrer puis relire
const sc = sid => P.scenes.find(s => s.id === sid);
function echanger(sid, sens) {  // avec la scene voisine du meme temps
  const m = P.scenes.filter(s => s.temps === T), k = m.findIndex(s => s.id === sid), a = P.scenes.indexOf(m[k]), b = P.scenes.indexOf(m[k + sens]);
  if (b >= 0) [P.scenes[a], P.scenes[b]] = [P.scenes[b], P.scenes[a]];
}
const CONT = [['lieu', 'Lieu', 'in a small Parisian bathroom with white tiles and a round mirror'], ['tenue', 'Tenue', 'wearing a white ribbed tank top and grey cotton shorts'],
  ['cheveux', 'Coiffure du jour', 'hair in a loose bun'], ['lumiere', 'Lumière', 'soft morning window light'], ['pdv', 'Point de vue', 'shot at eye level on a phone', 'Décrire la vue, pas l\'appareil : un téléphone « posé sur le comptoir » serait dessiné dans l\'image.']];
const RACCORDS = [['coupe', 'Coupe : la scène a sa propre image'], ['continu', 'Continu : suite du clip précédent, sans coupe visible'], ['arrivee', 'Arrivée : le clip précédent finit sur l\'image de cette scène']];
const CH = {t1: true, t2: true, t3: true, t4: true, mode: 'pause', refaire: false, hd: false};  // reglages de la chaine de production
const dfr = d => d ? new Date(d + 'T12:00').toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'long', year: 'numeric'}) : '';
const f = (k, lab, v, o = {}) => `<label>${lab}${o.area ? `<textarea ${o.at || ''} rows="${o.rows || 2}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>`
  : `<input ${o.at || ''} type="${o.type || 'text'}" ${o.step ? `step="${o.step}"` : ''} value="${esc(v)}" placeholder="${esc(o.ph || '')}">`}${aide(o.aide)}</label>`.replace('<textarea ', `<textarea data-k="${k}" `).replace('<input ', `<input data-k="${k}" `);

function rendreProjet() {
  const p = perso() || {nom: P.personnage}, vide = !P.scenes.some(s => s.temps === 1);
  const SC = P.scenes.filter(s => s.temps === T), dep = D.depots.filter(x => x.temps === T || x.erreur), DEF = (E.bibliotheque.defauts || {})[T] || '';
  const LT = E.bibliotheque.loras.filter(x => x.temps_min <= T);  // LoRA que la categorie admet a ce temps
  let no = 0;  // numero de section, dans l'ordre de la page
  const sec = (cle, titre, sous = '', defaut = true) => `<details class="sec" data-sec="${cle}"${ouv(cle, defaut)}><summary><span class="n">${++no}</span>${titre}${sous ? `<small>${sous}</small>` : ''}</summary>`;
  $('#persos').style.display = 'none'; $('#onglets').style.display = '';
  $('#onglets').innerHTML = NT.map(t => `<button class="chip ${t === T ? 'on' : ''}" data-t="${t}">${t}. ${TEMPS[t][0]} <small>${TEMPS[t][1]}, ${P.scenes.filter(s => s.temps === t).length}</small></button>`).join('');
  vue.innerHTML = `
    <div class="row tete"><a class="lien" href="#/">${ic('retour')}Projets de ${esc((E.personnages.find(x => x.slug === P.personnage) || p).nom)}</a><span class="sp"></span><span class="mut">${P.id}</span></div>
    <input data-k="titre" value="${esc(P.titre)}" style="font-size:18px;font-weight:600;margin-top:8px">
    <div class="steps" id="etapes"></div>
    <details class="sec" data-sec="chaine"${ouv('chaine', ['en cours', 'pause', 'erreur'].includes(D.chaine.etat))} style="margin-top:6px"><summary>${ic('chaine')}Production en chaîne<small id="chres"></small></summary>
      <div class="panel" id="chaine"></div></details>
    <div class="panel"><b>${T}. ${TEMPS[T][0]}</b><div class="mut">${QUOI[T]}</div>
      ${T > 2 && P.suite ? `<div style="margin-top:6px">Suite annoncée : ${esc(P.suite)}</div>` : ''}
      ${T > 2 ? '<div class="mut" style="margin-top:6px">Ajouter les scènes ici, ou importer un plan déposé par votre agent dans server/jobs/atelier/.</div>' : ''}
      ${`<div style="margin-top:8px;font-size:14px">LoRA par défaut de ce temps : ${DEF ? `<b>${esc(DEF)}</b>` : '<span class="mut">aucune</span>'} <a href="#/loras">Bibliothèque</a> · <a href="/hub">Hub</a></div>
        <div class="aide">Posées sur chaque scène ajoutée à ce temps, et sur les plans importés qui ne disent rien des LoRA. Chaque scène reste modifiable.</div>
        ${DEF && SC.length ? `<div class="row"><button class="s" data-a="poserdefauts">${ic('lora')}Poser ces LoRA sur les scènes de ce temps</button></div>` : ''}`}</div>
    ${T === 2 ? `<div class="panel">
      ${f('brief2', 'Consigne pour la montée (facultatif)', P.brief2, {area: 1, rows: 2, aide: 'En français. Ce que ce temps doit montrer de plus que l\'accroche : même lieu, un cran plus loin ; la tenue peut se défaire.'})}
      <div class="row"><label class="g">Scènes<select data-k="nb2">${[2, 3, 4, 5, 6].map(n => `<option ${n === P.nb2 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <button class="p" data-a="ecrire2" ${vide || !E.redacteur ? 'disabled' : ''}>${ic('ecrire')}${SC.length ? 'Réécrire la montée' : 'Écrire la montée'}</button></div>
      ${vide ? '<div class="mut" style="margin-top:6px">Écrire d\'abord le teaser (temps 1).</div>' : E.redacteur ? '' : '<div class="mut" style="margin-top:6px">Rédacteur IA arrêté : ajouter les scènes à la main.</div>'}</div>` : ''}
    ${dep.length ? `<div class="panel"><b>Plans déposés par l'agent</b>${dep.map(depotHtml).join('')}</div>` : ''}
    ${T === 1 ? `
    ${sec('idee', 'Idée', esc(P.brief || ''))}
    <div class="panel">
      ${f('brief', 'Idée de départ', P.brief, {area: 1, rows: 2, ph: 'Elle rentre du sport, trop chaud, elle hésite à enlever son pull devant la caméra',
        aide: 'En français, quelques mots suffisent. Le rédacteur en tire le scénario, les textes et le découpage.'})}
      ${f('suite', 'Ce que la suite payante montre (facultatif)', P.suite, {area: 1, rows: 1,
        aide: 'À votre main. Le rédacteur s\'en sert pour que l\'accroche promette quelque chose de vrai ; il n\'écrit pas cette suite.'})}
      ${f('date_perso', 'Date du personnage', P.date_perso, {type: 'date', aide: 'Fictive : le jour où elle vit la scène. Viser le jour de publication. La saison et les fêtes proches en sont déduites.'})}
      ${f('contexte', 'Contexte du moment (facultatif)', P.contexte, {area: 1, rows: 1, ph: 'Premier froid sur Lyon, elle prépare ses cadeaux de Noël',
        aide: 'Météo, événement, ce qu\'elle vit ces jours-ci. Guide l\'idée, la tenue, la lumière et les textes de tous les temps.'})}
      <div class="mut" style="margin-top:8px">Dates réelles : créé le ${esc(P.cree || '')}, modifié le ${esc(P.modifie || '')}.</div>
      <div class="row"><label class="g">Scènes<select data-k="nb_scenes">${[2, 3, 4, 5, 6].map(n => `<option ${n === P.nb_scenes ? 'selected' : ''}>${n}</option>`).join('')}</select>${aide('3 ou 4 scènes de 5 s tiennent dans une accroche de 15 à 20 s.')}</label>
        <button class="p" data-a="ecrire">${ic('ecrire')}${vide ? 'Écrire le scénario' : 'Tout réécrire'}</button>
        ${vide ? '' : `<button data-a="retoucher">${ic('retoucher')}Retoucher</button>`}</div>
      <div class="mut" style="margin-top:6px">${E.redacteur ? 'Le rédacteur IA écrit le scénario, les textes et le découpage en scènes.' : 'Rédacteur IA arrêté : un scénario type sera tiré d\'une structure toute faite.'}
        ${vide ? '' : ' « Retoucher » garde les images des scènes inchangées.'}</div>
    </div></details>

    ${sec('textes', 'Textes', esc(P.accroche || P.pitch || ''))}
    <div class="panel">
      ${f('accroche', 'Accroche', P.accroche, {aide: 'Affichée en haut de la première scène, au-dessus du visage. 44 caractères au plus, deux lignes. Elle doit être vraie dès la première image.'})}
      ${f('legende', 'Légende de la publication', P.legende, {area: 1, aide: 'Le texte posté sous la vidéo. Elle n\'apparaît pas dans l\'image.'})}
      <div class="row haut"><div class="g">${f('cta', 'Carton de fin', P.cta, {aide: 'Dernière image de l\'accroche : où voir la suite.'})}</div>
        <div class="g">${f('hashtags', 'Mots-dièse', P.hashtags, {aide: 'Copiés avec la légende.'})}</div></div>
      <div class="row"><button data-a="variantes" ${vide ? 'disabled' : ''}>${ic('idee')}Proposer des variantes</button><button data-a="copier">${ic('copier')}Copier légende et mots-dièse</button></div>
      <div id="variantes"></div>
    </div></details>` : ''}

    ${sec('continuite', 'Continuité', 'ce qui ne change pas d\'une image à l\'autre, pour tous les temps', Object.values(P.continuite).some(Boolean) || !!P.reference)}
    <div class="panel"><div class="mut">En anglais. Ces éléments sont ajoutés à la description de chaque image : les écrire ici une seule fois, et ne garder dans chaque scène que le cadrage, la pose et l'expression. Laisser vide ce qui change en cours de vidéo.</div>
      ${CONT.map(([k, lab, ph, aide]) => f(k, lab, P.continuite[k], {at: 'data-c="1"', ph, aide: k === 'tenue' ? 'Temps 1 seulement. Dans les temps 2 à 4 elle n\'est pas ajoutée : elle se défait d\'une scène à l\'autre, chaque scène dit ce qu\'elle porte.' : aide})).join('')}
      ${T > 1 ? '<div class="aide">Temps 2 à 4 : la tenue ci-dessus n\'est pas ajoutée aux images, et « nsfw » est ajouté d\'office à la fin de chaque description.</div>' : ''}
      <label>Image de référence<select data-k="reference"><option value="">Aucune : chaque image est créée à partir de sa description</option>
        ${P.scenes.filter((s, i) => s.temps === 1 && s.still && !(s.raccord === 'continu' && P.scenes.slice(0, i).some(x => x.temps === 1))).map(s => `<option value="${s.id}" ${s.id === P.reference ? 'selected' : ''}>Scène ${P.scenes.filter(x => x.temps === 1).indexOf(s) + 1} du temps 1 : ${esc(s.titre)}</option>`).join('')}</select>
        ${aide('Avec une image de référence, les autres images en sont tirées par retouche : même personne, même pièce, même tenue, seule la pose change ; elle garde aussi le cadrage de la référence, donc une scène dont la description contient « close-up » est tirée à part, avec la fiche de continuité. À choisir une fois l\'image de cette scène réussie. Les scènes « libres » et celles qui portent des LoRA gardent leur propre image.')}</label>
    </div></details>

    ${sec('scenes', 'Scènes', `${SC.length}, environ ${Math.round(SC.reduce((a, s) => a + (s.duree || 5), 0) + (T === 1 && P.montage.carton ? 2.6 : 0))} s`)}
    ${SC.length > 1 ? `<div class="row tete" style="margin-bottom:8px"><button class="s" data-a="plier">${ic('plier')}Replier ou déplier les descriptions</button></div>` : ''}

      <div class="gt">Ce qui s'affiche</div>

      <label>Cran dans la progression<select data-s="${s.id}" data-k="cran">${[0, 1, 2, 3, 4, 5].map(v => `<option value="${v}" ${v === (s.cran || 0) ? 'selected' : ''}>${v ? v + (v === 1 ? ' : anodin' : v === 5 ? ' : le plus osé de ce temps' : '') : 'Non renseigné'}</option>`).join('')}</select>
        ${aide('Sert au contrôle des plans : d\'une scène à l\'autre le cran ne doit pas redescendre.')}</label>
      ${i ? `<label>Raccord avec la scène précédente<select data-s="${s.id}" data-k="raccord">${RACCORDS.map(([v, l]) => `<option value="${v}" ${v === s.raccord ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

          : s.raccord === 'arrivee' ? '<div class="mut" style="margin-top:4px">Le clip précédent se termine sur l\'image de cette scène (clip début/fin, deux fois le prix d\'un clip simple). Créer cette image avant le clip précédent ; si elle change, il est à refaire.</div>' : ''}` : ''}

          <div class="g">${f('duree', 'Durée gardée (s)', s.duree, {type: 'number', step: '0.1', at: `data-s="${s.id}"`, aide: '0 : tout le clip. Une durée réglée ici n\'est pas raccourcie par la durée visée.'})}</div></div>
        <label class="c" style="margin-top:10px"><input type="checkbox" data-s="${s.id}" data-k="tattoos" ${s.tattoos ? 'checked' : ''}>Épaules et poitrine visibles (tatouages)</label>

        <label class="g">Transition<select data-m="1" data-k="transition"><option value="coupe" ${P.montage.transition === 'coupe' ? 'selected' : ''}>Coupe franche</option><option value="fondu" ${P.montage.transition === 'fondu' ? 'selected' : ''}>Fondu</option></select>${aide('Entre deux scènes en raccord « coupe ». Les raccords continus restent collés sans coupe.')}</label>
      </div>
      <div class="gt">Texte</div>

        ${aide('Sans fond en aplat. « Contour » reste lisible sur une image claire ou chargée.')}</label>

        ${aide('Les plans sont raccourcis en proportion (2 s au moins chacun), sans toucher aux raccords continus ni aux durées réglées à la main.')}</label>
        ${T === 1 ? `<button class="s" data-a="teaser" style="margin-top:20px">${ic('valider')}Réglages teaser 15 s</button>` : ''}</div>
      <div class="row">${T === 1 ? `<label class="c"><input type="checkbox" data-m="1" data-k="carton" ${P.montage.carton ? 'checked' : ''}>Carton de fin</label>` : ''}
        <label class="c"><input type="checkbox" data-m="1" data-k="noir" ${P.montage.noir ? 'checked' : ''}>Fin au noir</label></div>
      <div class="aide">${T === 1 ? 'Carton de fin : 2,6 s avec le texte « Carton de fin » de l\'étape 2. ' : ''}Fin au noir : la dernière image s'éteint en fondu au lieu de couper net.</div>
      <div class="gt">Son</div>
      <label>Musique<select data-m="1" data-k="musique"><option value="">Aucune</option>${E.musiques.map(m => `<option ${m === P.montage.musique ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
        ${aide(E.musiques.length ? 'Coupée à la durée de la vidéo. Pour en ajouter : déposer des fichiers mp3 dans data/audio sur le serveur.' : 'Aucun fichier : déposer des mp3 dans data/audio sur le serveur.')}</label>

    </div></details>
    <div class="row" style="margin-top:24px"><span class="sp"></span><button class="d" data-a="archiver">${ic('archiver')}Archiver ce projet</button></div>`;
  majDyn();
}

// Zones qui changent pendant un calcul : rendues a part pour ne pas toucher aux champs en cours de saisie.
function majDyn() {
  const set = (el, html, k) => { if (el && sig[k] !== html) { sig[k] = html; el.innerHTML = html; } };
  const i = ETAPES.findIndex(e => e[0] === D.etape);
  set($('#etapes'), ETAPES.map((e, j) => `<span class="${j < i ? 'done' : j === i ? 'cur' : ''}">${e[1]}</span>`).join(''), 'etapes');
  const SCT = P.scenes.filter(s => s.temps === T);
  const rq = (D.controle || {})[T] || [], nSc = sid => P.scenes.filter(s => s.temps === T).findIndex(s => s.id === sid) + 1;
  set($('#controle'), `<b>Contrôle des plans</b> <span class="mut">avant de payer un calcul</span>` + (rq.length
    ? `<ul class="rq">${rq.map(x => `<li class="${x.grave ? 'err' : ''}">${x.scene ? `<b>Scène ${nSc(x.scene)}</b> : ` : ''}${esc(x.msg)}</li>`).join('')}</ul>`
    : `<div class="okc">Aucune remarque.</div>`), 'controle');
  const c = D.chaine, occ = D.prod.etat === 'en cours' || c.etat === 'en cours', actif = c.etat === 'en cours' || c.etat === 'pause';
  const ETATS = {'en cours': 'Chaîne en cours', pause: 'Chaîne en pause', termine: 'Chaîne terminée', arretee: 'Chaîne arrêtée', erreur: 'Chaîne en erreur'};
  set($('#chres'), c.etat ? `<span class="${c.etat === 'termine' ? 'okc' : c.etat === 'erreur' ? 'err' : c.etat === 'pause' ? 'avt' : ''}">${ETATS[c.etat].replace('Chaîne ', '')}</span>, temps ${c.temps.join(', ')}` : 'tout le projet, d\'une traite ou avec pause', 'chres');
  set($('#chaine'), `<div class="mut">Images des temps cochés, puis clips et montage, un temps après l'autre. Ne calcule que ce qui manque. Un devis est affiché avant tout lancement.</div>
    <div class="row">${NT.map(t => `<label class="c"><input type="checkbox" data-ch="t${t}" ${CH['t' + t] ? 'checked' : ''} ${actif ? 'disabled' : ''}>${t}. ${TEMPS[t][0]} (${P.scenes.filter(x => x.temps === t).length})</label>`).join('')}</div>
    <div class="row"><label class="g">Déroulement<select data-ch="mode" ${actif ? 'disabled' : ''}><option value="pause" ${CH.mode === 'pause' ? 'selected' : ''}>Pause après les images, pour choisir les prises</option>
      <option value="complet" ${CH.mode === 'complet' ? 'selected' : ''}>D'une traite, sans pause</option></select>
      ${aide('Avec la pause, aucun clip n\'est payé sur une image ratée : les images sont à vérifier, puis « Continuer ». D\'une traite, les clips partent de la dernière image de chaque scène.')}</label></div>
    <div class="row"><label class="c"><input type="checkbox" data-ch="refaire" ${CH.refaire ? 'checked' : ''} ${actif ? 'disabled' : ''}>Tout refaire (nouvelles prises, les anciennes sont gardées)</label>
      <label class="c"><input type="checkbox" data-ch="hd" ${CH.hd ? 'checked' : ''} ${actif ? 'disabled' : ''}>Clips en 720p</label></div>
    <div class="aide">Tout refaire : recalcule aussi ce qui existe déjà. 720p : quatre fois le prix du 480p, à garder pour la version finale.</div>
    ${c.etat === 'pause' ? `<div class="aide">Réglages verrouillés pendant la pause. Pour refaire des images sans quitter la chaîne : « Refaire les images de ce temps », dans « Images et clips ». Pour changer les réglages : abandonner la chaîne (les images restent), puis la relancer.</div>` : ''}
    <div class="row">${c.etat === 'pause' ? `<button class="p" data-a="chainesuite">${ic('lancer')}Continuer : clips et montage</button>` : `<button class="p" data-a="chaine" ${occ || !E.can_run ? 'disabled' : ''}>${ic('lancer')}Lancer la chaîne</button>`}
      ${actif ? `<button data-a="chainestop" ${c.stop ? 'disabled' : ''}>${ic('arret')}${c.etat === 'pause' ? 'Abandonner la chaîne' : c.stop ? 'Arrêt demandé' : 'Arrêter après l\'étape en cours'}</button>` : ''}</div>
    ${c.ailleurs ? `<div class="mut" style="margin-top:6px">Une chaîne tourne sur le projet ${esc(c.ailleurs)} : les lancements attendent sa fin.</div>` : ''}
    ${c.etat ? `<div style="margin-top:8px"><b class="${c.etat === 'termine' ? 'okc' : c.etat === 'erreur' ? 'err' : ''}">${ETATS[c.etat]}</b> <span class="mut">temps ${c.temps.join(', ')} : ${esc(c.etape)}</span>
      ${c.etat === 'erreur' ? `<pre class="err">${esc(c.erreur)}</pre>` : ''}<pre>${esc(c.journal.join('\n'))}</pre></div>` : ''}`, 'chaine');
  const der = {};
  for (const s of P.scenes) {
    const c = D.choix[s.id] || {}, t = D.prises[s.id] || {images: [], clips: [], source: {}}, u = n => `/afile/${P.id}/${n}`;
    const clips = t.clips.filter(x => t.source[x] === c.image), pv = der[s.temps], cont = pv && s.raccord === 'continu';
    der[s.temps] = s;
    set($(`.media[data-sid="${s.id}"]`), `
      <div class="pv">${c.clip ? `<video src="${u(c.clip)}" poster="${u(c.image)}" muted loop playsinline controls preload="none"></video>`
        : c.image ? `<a href="${u(c.image)}" target="_blank"><img src="${u(c.image)}" loading="lazy"></a>` : 'pas encore d\'image'}</div>
      <div class="side">
        ${t.images.length > 1 && !cont ? `<div class="mut">Prises</div><div class="takes">${t.images.map(n => `<img src="${u(n)}" loading="lazy" class="${n === c.image ? 'on' : ''}" data-a="prise" data-n="${n}">`).join('')}</div>` : ''}
        ${clips.length > 1 ? `<div class="takes">${clips.map((n, j) => `<button class="s ${n === c.clip ? 'on' : ''}" data-a="priseclip" data-n="${n}">Clip ${j + 1}</button>`).join('')}</div>` : ''}
        <div class="row tete">${cont ? '' : `<button class="s" data-a="image" ${occ || !s.still ? 'disabled' : ''}>${ic(c.image ? 'refaire' : 'image')}${c.image ? 'Autre image' : 'Créer l\'image'}</button>`}
          <button class="s" data-a="clip" ${occ || !(cont ? (D.choix[pv.id] || {}).clip : c.image) || !s.motion ? 'disabled' : ''}>${ic(c.clip ? 'refaire' : 'clip')}${c.clip ? 'Autre clip' : 'Créer le clip'}</button></div>
        <div class="mut" style="margin-top:6px">${c.clip ? 'Clip prêt.' : cont ? ((D.choix[pv.id] || {}).clip ? (t.clips.length ? 'Le clip précédent a changé : ce clip est à refaire.' : 'Suite du clip précédent : prête à lancer.') : 'Suite du clip précédent : créer d\'abord celui-ci.')
          : c.image ? (t.clips.length && !clips.length ? 'L\'image a changé : le clip est à refaire.' : 'Image prête : la vérifier avant de lancer le clip.') : ''}</div>
        ${(rl => rl && rl.image === c.image ? `<div class="${rl.ok ? 'okc' : 'err'}" style="margin-top:6px;font-size:13px">Relecture : ${rl.ok ? 'rien à signaler.' : esc(rl.constat)}${!rl.ok && rl.consigne ? ` <span class="mut">${esc(rl.consigne)}</span>` : ''}</div>` : '')((((D.relecture || {})[s.temps] || {}).scenes || {})[s.id])}
      </div>`, 'm' + s.id);
  }
  const d = D.devis[T], pr = D.prod, R = (D.relecture || {})[T] || {};
  const RI = aRefaire(), nRI = RI.filter(s => (D.choix[s.id] || {}).image).length;
  set($('#prod'), `<div class="acts">
    <div class="act"><button class="p" data-a="chainetemps" ${occ || c.etat === 'pause' || !E.can_run ? 'disabled' : ''}>${ic('lancer')}Tout produire pour ce temps</button>
      <span class="mut">${c.etat === 'pause' ? 'Indisponible : une chaîne est en pause (« Production en chaîne », en haut).' : `Images, ${CH.mode === 'pause' ? 'pause, ' : ''}clips, montage. Réglages : « Production en chaîne », en haut.`}</span></div>
    <div class="act"><button data-a="images" ${occ || !d.images.n ? 'disabled' : ''}>${ic('image')}Créer les images manquantes (${d.images.n})</button><span class="mut">${d.images.n ? 'Environ ' + usd(d.images.usd) + '.' : 'Aucune image ne manque.'}</span></div>
    <div class="act"><button data-a="refaireimages" ${occ || !nRI ? 'disabled' : ''}>${ic('refaire')}Refaire les images de ce temps (${RI.length})</button>
      <span class="mut">${nRI ? `Environ ${usd(0.003 * RI.length + 0.05)}. Nouvelles prises ; les anciennes restent sélectionnables${c.etat === 'pause' ? ', la chaîne reste en pause' : ''}.` : 'Aucune image à refaire.'}</span></div>
    <div class="act"><button data-a="clips" ${occ || !d.clips.n ? 'disabled' : ''}>${ic('clip')}Créer les clips manquants (${d.clips.n})</button>
      <span class="mut">${d.clips.n ? `Environ ${usd(d.clips.usd)} en 480p, ${usd(d.clips.usd_hd)} en 720p.` : 'Aucun clip ne manque.'}</span></div>
    ${T < 3 ? `<div class="act"><button data-a="relire" ${R.etat === 'attente' || !E.redacteur || !SCT.some(s => (D.choix[s.id] || {}).image) ? 'disabled' : ''}>${ic('relire')}${R.etat === 'attente' ? 'Relecture en cours...' : 'Relire les images'}</button>
      <span class="mut">${E.redacteur ? 'Le rédacteur IA cherche les défauts avant les clips. Sans GPU ; fait d\'office à la pause de la chaîne.' : 'Rédacteur IA arrêté.'}</span></div>` : ''}</div>
    ${T < 3 ? `${R.etat === 'erreur' ? `<div class="err" style="margin-top:6px">Relecture : ${esc(R.erreur)}</div>` : R.etat === 'pret' ? `<div style="margin-top:6px;font-size:14px"><b>Relecture du ${esc(R.date)}</b> :
        ${(n => n ? `<span class="err">${n} image(s) à refaire</span>` : '<span class="okc">rien à refaire</span>')(Object.entries(R.scenes).filter(([k, v]) => !v.ok && v.image === (D.choix[k] || {}).image).length)}. ${esc(R.ensemble)}</div>` : ''}` : ''}
    <label class="c" style="margin-top:8px"><input type="checkbox" id="hd" ${sig.hd ? 'checked' : ''}>Clips en 720p (quatre fois plus cher : à garder pour la version finale)</label>
    <div class="mut" style="margin-top:6px">${E.can_run ? 'Chaque lancement passe par le plafond GPU du jour. Les clips démarrent leur propre pod (2 à 5 minutes d\'attente).' : 'Clé RunPod absente : lancement impossible.'}</div>
    ${pr.etat ? `<div style="margin-top:8px"><b class="${pr.etat === 'en cours' ? '' : pr.etat === 'termine' ? 'okc' : 'err'}">${{'en cours': 'Calcul en cours', termine: 'Dernier calcul terminé', arrete: 'Dernier calcul arrêté', interrompu: 'Dernier calcul interrompu'}[pr.etat]}</b>
      ${pr.cout != null ? ` <span class="mut">${usd(pr.cout)}</span>` : ''}${pr.echecs ? ` <span class="err">${pr.echecs} échec(s)</span>` : ''}<pre>${esc(pr.log)}</pre></div>` : ''}`, 'prod');
  const F = D.finals[T], m = D.montage, fin = F.at(-1), u = n => `/afile/${P.id}/${n}`, inf = fin && D.infos[fin], an = (fin && D.analyses[fin]) || {}, pla = fin && (D.planches || {})[fin];
  set($('#mont'), `

function surveiller() {
  clearInterval(timer); timer = null;
  const lu = d => [...Object.values(d.relecture || {}), ...Object.values(d.analyses || {})].some(x => x.etat === 'attente');
  if (!D || (D.prod.etat !== 'en cours' && D.montage.etat !== 'en cours' && D.chaine.etat !== 'en cours' && !lu(D))) return;
  timer = setInterval(async () => {
    if (!P) return clearInterval(timer);
    try {
      const n = await api('/api/a/projet?id=' + P.id), avant = D.prod.etat, avantCh = D.chaine.etat;
      for (const k of ['choix', 'prises', 'finals', 'etape', 'montage', 'prod', 'devis', 'depots', 'chaine', 'controle', 'relecture', 'publication', 'infos', 'analyses', 'planches']) D[k] = n[k];
      majDyn();
      if (avant === 'en cours' && n.prod.etat !== 'en cours') etat();
      if (avantCh === 'en cours' && n.chaine.etat !== 'en cours') toast({pause: 'Images prêtes : choisir les prises, puis Continuer', termine: 'Chaîne terminée', arretee: 'Chaîne arrêtée', erreur: 'Chaîne en erreur'}[n.chaine.etat] || '', n.chaine.etat !== 'erreur');
      if (n.prod.etat !== 'en cours' && n.montage.etat !== 'en cours' && n.chaine.etat !== 'en cours' && !lu(n)) { clearInterval(timer); timer = null; }
    } catch (e) {}
  }, 4000);
}

async function loraRetirer(el) {
  if (!confirm(`Retirer « ${el.dataset.n} » du catalogue ? Le fichier reste sur le volume ; les scènes qui la nomment seront signalées au contrôle des plans.`)) return;
  E.bibliotheque = (await api('/api/a/lora', {name: el.dataset.n, supprimer: true})).bibliotheque; vueLoras();
}
async function defautsSauver() {
  E.bibliotheque = (await api('/api/a/lora/defauts', {defauts: Object.fromEntries($$('[data-d]', vue).map(el => [el.dataset.d, el.value]))})).bibliotheque; toast('Défauts enregistrés', true); vueLoras();
}

// --- Personnages -----------------------------------------------------------------------------------
function vuePersos() {
  vue.innerHTML = `<div class="row tete"><a class="lien" href="#/">${ic('retour')}Retour aux projets</a><span class="sp"></span><button class="p" onclick="location.hash='#/perso'">${ic('ajouter')}Nouveau personnage</button></div>
    <h2>Personnages</h2>` + E.personnages.map(p => `<a class="card" href="#/perso/${esc(p.slug)}"><div><b>${esc(p.nom)}${p.statut === 'archive' ? ' (archivé)' : ''}</b>
      <span class="mut">${esc(p.accroche)}</span><span class="mut">${p.age} ans, publie en ${esc(p.langue)}, ${p.lora ? 'LoRA en place' : 'sans LoRA'}, ${E.projets.filter(x => x.personnage === p.slug).length} vidéo(s)</span></div></a>`).join('');
}
const FICHE = [['identite', 'Identité (métier, ville, situation)'], ['apparence', 'Apparence'], ['voix', 'Voix, tics de langage'], ['personnalite', 'Personnalité, défauts'],
  ['seduction', 'Manière de séduire'], ['univers', 'Univers, routine, fil rouge'], ['limites', 'Limites']];
async function vuePerso(slug) {
  const p = slug ? await api('/api/a/personnage?slug=' + encodeURIComponent(slug)) : {nom: '', age: '', langue: 'en', fiche: {}, lieux: [], tenues: [], ecriture: {plateforme: 'Fanvue'}, generation: {lora_strength: 1}};
  const i = (k, lab, v, o = {}) => `<label>${lab}${o.area ? `<textarea data-p="${k}" rows="${o.rows || 2}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>`
    : `<input data-p="${k}" type="${o.type || 'text'}" ${o.step ? `step="${o.step}"` : ''} value="${esc(v)}" placeholder="${esc(o.ph || '')}">`}${aide(o.aide)}</label>`;
  const g = p.generation || {}, w = p.ecriture || {};
  vue.innerHTML = `<div class="row tete"><a class="lien" href="#/persos">${ic('retour')}Personnages</a></div>
    <h2>${slug ? esc(p.nom) : 'Nouveau personnage'}</h2>
    ${slug ? '' : `<div class="panel"><label>Concept, en une ou deux phrases<textarea id="concept" rows="2" placeholder="Une barmaid de nuit à Marseille, brune, tatouée, grande gueule et tendre"></textarea></label>
      <div class="row"><button class="p" data-a="persoia" ${E.redacteur ? '' : 'disabled'}>${ic('ecrire')}Rédiger la fiche avec l'IA</button><span class="mut">${E.redacteur ? 'La fiche reste modifiable avant enregistrement.' : 'Rédacteur IA arrêté : remplir la fiche à la main.'}</span></div></div>`}
    <div class="panel"><input type="hidden" data-p="slug" value="${esc(slug)}">
      <div class="mut">Ce que le rédacteur IA sait d'elle : il s'en sert pour chaque idée, chaque scénario et chaque texte.</div>
      <div class="row"><div class="g">${i('nom', 'Nom', p.nom)}</div><div style="width:84px">${i('age', 'Âge (21 au moins)', p.age, {type: 'number'})}</div>
        <div style="width:110px"><label>Publie en<select data-p="langue"><option value="en" ${p.langue === 'en' ? 'selected' : ''}>anglais</option><option value="fr" ${p.langue === 'fr' ? 'selected' : ''}>français</option></select></label></div></div>
      ${i('accroche', 'La phrase qui la résume', p.accroche, {aide: 'Affichée dans la liste des personnages et rappelée au rédacteur.'})}
      ${FICHE.map(([k, l]) => i('fiche.' + k, l, p.fiche?.[k], {area: 1})).join('')}
    </div>
    <h2>Lieux et tenues <small>un par ligne : français | anglais</small></h2>
    <div class="panel"><div class="mut">Le rédacteur pioche dedans pour la fiche de continuité : la partie française lui sert à choisir, la partie anglaise part dans la description de l'image.</div>${i('lieux', 'Lieux', (p.lieux || []).join('\n'), {area: 1, rows: 5, ph: 'sa cuisine | in her small kitchen with a wooden counter'})}
      ${i('tenues', 'Tenues', (p.tenues || []).join('\n'), {area: 1, rows: 5, ph: 'robe d\'été | a light summer dress with thin straps'})}</div>
    <h2>Écriture</h2>
    <div class="panel">${i('ecriture.ton', 'Ton', w.ton, {aide: 'Comment elle écrit ses accroches et ses légendes.'})}
      ${i('ecriture.cta', 'Appel à l\'action habituel', w.cta, {aide: 'Proposé comme carton de fin de chaque accroche.'})}
      <div class="row haut"><div class="g">${i('ecriture.plateforme', 'Plateforme payante', w.plateforme, {aide: 'Où se trouve la suite.'})}</div>
        <div class="g">${i('ecriture.hashtags', 'Mots-dièse', w.hashtags, {aide: 'Proposés pour chaque publication.'})}</div></div>
      ${i('ecriture.interdits', 'À ne jamais écrire ou montrer', w.interdits, {area: 1, aide: 'Rappelé au rédacteur à chaque écriture.'})}</div>
    <h2>Génération <small>réglages envoyés au modèle d'image</small></h2>
    <div class="panel">${i('generation.zimage_prefix', 'Début de chaque description (anglais)', g.zimage_prefix, {area: 1, ph: 'a woman with long dark hair and brown eyes,',
        aide: 'Placé devant chaque description d\'image : mot déclencheur de la LoRA du visage, cheveux, yeux.'})}
      <div class="row haut"><div class="g">${i('generation.lora', 'Fichier LoRA du visage', g.lora, {aide: 'Vide : le visage change d\'une image à l\'autre. L\'entraînement coûte environ 2 $ et se fait hors de cette page.'})}</div>
        <div style="width:90px">${i('generation.lora_strength', 'Force', g.lora_strength, {type: 'number', step: '0.1', aide: '1 en général.'})}</div></div>
      ${i('generation.corps', 'Corps (anglais)', g.corps, {area: 1, aide: 'À votre main. Ajouté à chaque image.'})}
      ${i('generation.suffixe', 'Fin de chaque description', g.suffixe, {area: 1, rows: 1, aide: 'Qualité, grain, objectif. Vide : réglage commun à tous les personnages.'})}
      ${i('generation.note', 'Note pour le rédacteur', g.note, {area: 1, rows: 1, aide: 'Ce que la LoRA du visage porte déjà (tatouages, piercing), pour qu\'il ne le redécrive pas.'})}
      <div class="mut" style="margin-top:8px">Les LoRA de tenue, de pose ou de style se règlent dans la <a href="#/loras">bibliothèque de LoRA</a>.</div></div>
    <div class="row"><button class="p" data-a="persosauver">${ic('valider')}Enregistrer</button><span class="sp"></span>
      ${slug ? (p.statut === 'archive' ? '<button data-a="persoreactiver">Réactiver</button>' : '<button class="d" data-a="persoarchiver">Archiver</button>') : ''}</div>
    <p class="mut">Personnages fictifs, adultes, sans ressemblance avec une personne réelle, présentés comme créés par IA.</p>`;
  vuePerso.statut = p.statut || 'actif';
}
function lirePerso() {
  const o = {};
  for (const el of $$('[data-p]', vue)) {
    const ks = el.dataset.p.split('.'), v = ['lieux', 'tenues'].includes(ks[0]) ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : el.value;
    if (ks.length === 1) o[ks[0]] = v; else (o[ks[0]] ||= {})[ks[1]] = v;
  }
  return o;
}
async function persoSauver(statut) {
  const o = lirePerso(); o.statut = typeof statut === 'string' ? statut : vuePerso.statut; o.nouveau = !o.slug;
  const r = await api('/api/a/personnage', o);
  if (o.statut !== 'archive') { cur = r.personnage.slug; localStorage.setItem('perso', cur); }
  toast('Personnage enregistré', true);
  location.hash = o.statut === 'archive' ? '#/persos' : '#/';
}
async function persoIA() {
  const c = $('#concept').value.trim(); if (!c) return toast('Décrire le personnage en une ou deux phrases');
  ecrire({kind: 'personnage', consigne: c}, r => {
    const p = r.resultat, put = (k, v) => { const el = $(`[data-p="${k}"]`, vue); if (el && v != null) el.value = Array.isArray(v) ? v.join('\n') : v; };
    for (const k of ['nom', 'age', 'langue', 'accroche', 'lieux', 'tenues']) put(k, p[k]);
    for (const grp of ['fiche', 'ecriture', 'generation']) for (const [k, v] of Object.entries(p[grp] || {})) put(grp + '.' + k, v);
    toast('Fiche rédigée : relire puis enregistrer', true);
  }, 'Rédaction de la fiche');
}

setInterval(() => { if (!document.hidden) etat().catch(() => {}); }, 60000);
route();
</script></body></html>
