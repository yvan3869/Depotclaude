<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="stylesheet" href="/ui.css">
<style>
  a.card { align-items:center; gap:14px; padding:14px; }
  a.card .ic { width:24px; height:24px; color:var(--acc); }
  a.card b { font-size:16px; } a.card .mut { -webkit-line-clamp:3; }
</style></head><body>
<header><div class="l1"><b>Studio</b><span class="sp"></span><small>Contenu généré par IA</small></div></header>
<main id="vue"></main>
<script src="/ui.js"></script>
<script>
const ESPACES = [
  ['Fabrication', [
    ['/atelier', 'montage', 'Production', 'Du script à la vidéo montée : casting, découpage en scènes, tournage (images et clips), son, montage.'],
    ['/social', 'envoyer', 'Diffusion', "Selfies tous publics pour faire vivre les comptes : semaine écrite et calculée d'avance, file à valider, texte et image prêts à publier."],
    ['/hub', 'lora', 'Matériel', 'Modèles et LoRA : catalogue par modèle de base et par catégorie, LoRA retenues, chargement sur le volume, veille.']]],
  ['Outils', [
    ['/test', 'image', 'Essais', "Essayer des réglages d'image (décor, cadrage, poses, corps, LoRA), voir les résultats, valider ou supprimer."],
    ['/tri', 'archiver', 'Rushes', 'Trier les clips et images tournés : soft, payant, à refaire, rejeté.'],
    ['/nouveau', 'ecrire', 'Ancien formulaire', "Un lot en trois temps, écrit à la main. Pour un nouveau projet, passer par la Production."]]],
];
$('#vue').innerHTML = ESPACES.map(([titre, l]) => `<h2>${titre}</h2>` + l.map(([u, i, n, d]) =>
  `<a class="card" href="${u}">${ic(i)}<span><b>${n}</b><span class="mut">${esc(d)}</span></span></a>`).join('')).join('');
</script>
</body></html>
