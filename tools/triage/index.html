<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rushes</title>
<meta name="theme-color" content="#0e0c13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='.3' cy='.2' r='1'%3E%3Cstop stop-color='%23c4a1ff'/%3E%3Cstop offset='.6' stop-color='%23ff8fb8'/%3E%3Cstop offset='1' stop-color='%23ffb48a'/%3E%3C/radialGradient%3E%3Crect width='32' height='32' rx='8' fill='%230e0c13'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui.css">
<style>
  :root { --paid:var(--acc2); }
  html, body { height:100%; }
  body { display:flex; flex-direction:column; }
  header { position:static; }
  header .l2 { display:flex; gap:6px 14px; flex-wrap:wrap; align-items:center; max-width:var(--larg); margin:4px auto 0; color:var(--mut); font-size:13px; }
  #name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 12ch; font-variant-numeric:tabular-nums; }
  #counts { display:flex; gap:12px; font-variant-numeric:tabular-nums; }
  #counts b { color:var(--txt); }
  main { flex:1; min-height:0; max-width:none; width:100%; display:flex; align-items:center; justify-content:center; padding:12px; }
  main video, main img { max-width:100%; max-height:100%; border-radius:6px; background:#000; }
  #empty { color:var(--mut); text-align:center; }
  footer { border-top:1px solid var(--line); background:var(--panel); padding:12px; }
  footer > div { display:grid; grid-template-columns:repeat(4,1fr) auto; gap:8px; max-width:var(--larg); margin:0 auto; }
  footer button { background:transparent; min-height:46px; font-size:15px; }
  footer button:hover:not(:disabled) { background:var(--acc-bg); }
  button kbd { min-width:1.6em; padding:1px 5px; border:1px solid currentColor; border-radius:4px; font:12px ui-monospace,monospace; text-align:center; }
  button[data-to=soft] { border-color:var(--acc); color:var(--acc); }
  button[data-to=paid] { border-color:var(--paid); color:var(--paid); }
  button[data-to=redo] { border-color:var(--warn); color:var(--warn); }
  button[data-to=reject] { border-color:var(--bad); color:var(--bad); }
  @media (max-width:640px) { footer > div { grid-template-columns:repeat(2,1fr); } #undo { grid-column:1/-1; } }
  @media (hover:none) { button kbd { display:none; } }
</style>
</head>
<body>
<header>
  <div class="l1"><a href="/">Studio</a><b>Rushes</b><span class="sp"></span><small id="pos"></small></div>
  <div class="l2"><span id="name"></span><div id="counts"></div></div>
</header>
<main id="stage"><p id="empty">Chargement...</p></main>
<footer><div>
  <button data-to="soft"><kbd>S</kbd>Short soft</button>
  <button data-to="paid"><kbd>P</kbd>Page payante</button>
  <button data-to="redo"><kbd>R</kbd>À refaire</button>
  <button data-to="reject"><kbd>X</kbd>Rejeter</button>
  <button id="undo"><kbd>Z</kbd>Annuler</button>
</div></footer>
<script>
const stage = document.getElementById('stage');
const LABELS = {soft:'Soft', paid:'Payant', redo:'A refaire', reject:'Rejetes'};
let files = [], i = 0, busy = false;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'},
                                      body:JSON.stringify(body)} : undefined);
  return r.json();
}

async function refresh(keep) {
  const d = await api('/api/list');
  files = d.files;
  if (!keep || i >= files.length) i = Math.min(i, Math.max(0, files.length - 1));
  document.getElementById('counts').replaceChildren(...Object.entries(d.counts).map(([k, v]) => {
    const s = document.createElement('span');
    const b = document.createElement('b');
    b.textContent = v;
    s.append(LABELS[k] + ' ', b);
    return s;
  }));
  document.getElementById('undo').disabled = !d.undo;
  show();
}

function show() {
  const name = files[i];
  document.querySelectorAll('button[data-to]').forEach(b => b.disabled = !name);
  document.getElementById('pos').textContent = name ? `${i + 1} / ${files.length}` : '';
  document.getElementById('name').textContent = name || '';
  if (!name) {
    const p = document.createElement('p');
    p.id = 'empty';
    p.textContent = 'Rien a trier. Les nouveaux fichiers apparaissent au rechargement.';
    return stage.replaceChildren(p);
  }
  const src = '/file/' + encodeURIComponent(name);
  const isVideo = /\.(mp4|webm|mov)$/i.test(name);
  const el = document.createElement(isVideo ? 'video' : 'img');
  el.src = src;
  if (isVideo) Object.assign(el, {autoplay:true, loop:true, muted:true, controls:true, playsInline:true});
  else el.alt = name;
  stage.replaceChildren(el);
}

async function decide(to) {
  const name = files[i];
  if (!name || busy) return;
  busy = true;
  try { await api('/api/move', {name, to}); await refresh(true); }
  finally { busy = false; }
}

async function undo() {
  if (busy) return;
  busy = true;
  try {
    const d = await api('/api/undo', {});
    await refresh(true);
    if (d.name) { const k = files.indexOf(d.name); if (k >= 0) { i = k; show(); } }
  } finally { busy = false; }
}

function step(n) { if (files.length) { i = (i + n + files.length) % files.length; show(); } }

document.querySelectorAll('button[data-to]').forEach(b => b.onclick = () => decide(b.dataset.to));
document.getElementById('undo').onclick = undo;
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = {s:'soft', p:'paid', r:'redo', x:'reject'};
  if (map[k]) decide(map[k]);
  else if (k === 'z') undo();
  else if (k === 'arrowright') step(1);
  else if (k === 'arrowleft') step(-1);
  else if (k === ' ') { const v = stage.querySelector('video'); if (v) { e.preventDefault(); v.paused ? v.play() : v.pause(); } }
});
refresh();
</script>
</body>
</html>
