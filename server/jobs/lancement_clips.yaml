# Lot de lancement : clips tous publics. Visage de face, gestes simples.
name: clips
defaults:
  still_size: [720, 1280]
  clip_size: [480, 832]
  mode: natural
  smooth: true
  grain: true
  seed: 1400
shots:
  - name: cafe_matin
    tattoos: false
    still: "medium shot, leaning on the counter of a small cluttered kitchen, oversized white men's shirt buttoned up, holding a coffee mug with both hands, messy hair, sleepy smile, looking at the camera, morning light, no makeup"
    motion: "She takes a sip of coffee from the mug, then looks at the camera and laughs softly."
