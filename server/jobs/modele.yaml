# MODELE DE FICHIER DE PLANS : reference en cours de validite.
# Tout plan s'ecrit en copiant ce fichier, puis en retirant ce qui ne sert pas. Ce modele est tenu a
# jour a chaque evolution du pilote ; les autres fichiers de ce dossier sont des exemples dates, qui
# peuvent etre en retard. Ne pas lancer ce fichier tel quel.
#
# La ligne "modele" ci-dessous est a recopier sans la changer : le pilote la compare a sa propre
# version et previent dans son journal si le plan a ete ecrit d'apres un modele perime.
#
# Historique
#   2026-11-14   premiere version : champs character, image, tattoos, body, end_edit, steps.
#   2026-11-14b  depot dans l'atelier : bloc "atelier", champs de plan titre, texte, voix, role.
#   2026-11-14c  bloc "atelier" : textes de publication du temps 1 (pitch, accroche, legende, cta, hashtags).
#   2026-11-14d  bloc "atelier" : date du personnage (date_perso, fictive) et contexte du moment, avec le temps 1.
#   2026-11-14e  continuite : bloc "atelier" continuite et reference, champs de plan raccord, libre et cran (atelier) ;
#                champs de plan edit, suite_de et end_image (pilote).
#   2026-11-14f  quatre temps : "atelier.temps" va de 1 a 4. Le 3 est maintenant le devoile (nudite, sans acte) et le
#                final prive passe en 4. Un plan depose avec un modele plus ancien et temps: 3 est lu comme temps: 4.
#                "loras" absent d'un plan depose : l'atelier pose les LoRA par defaut du temps ; "loras: []" : aucune.
#   2026-11-14g  champ de plan tenue_libre (pilote, avec "edit") : la retouche ne garde pas la tenue de l'image de depart.
#                Atelier, temps 2 a 4 : la tenue de la fiche de continuite n'est plus ajoutee aux "still" (chaque plan dit
#                ce qu'elle porte) et "nsfw" est ajoute a la fin de chaque "still".
#                REGLE : dans les temps 2, 3 et 4, chaque "still" dit ce qu'elle porte ou ne porte plus a cet instant.
#                Un depot dont un plan ne le dit pas est refuse (sauf plan en raccord continu).
#   2026-11-14h  LoRA classees par categorie (hub) : une LoRA n'est admise qu'a partir du temps de sa categorie, temps 1
#                compris ; un depot qui en nomme une trop tot est refuse. "loras" peut nommer une LoRA video (Wan 2.2) :
#                elle s'applique au clip du plan, pas a son image.
#   2026-11-14i  champs de plan transition et camera (atelier) : passage au plan et mouvement de camera lent, fabriques
#                au montage. Ne plus ecrire de mouvement de camera dans "motion".
#   2026-11-14j  bloc "atelier" : ambiance (fond sonore du lieu, une phrase en anglais), avec le temps 1.
#   2026-11-14k  champ de plan son (atelier) : bruit du geste, une phrase en anglais, cale au montage sur le geste.
#   2026-11-15a  bloc "atelier" : projet_de (temps 2 a 4 d'une video entiere deposee d'un coup : nom du fichier du
#                temps 1, le depot ira dans le projet que ce fichier ouvre ; plus besoin d'attendre le numero du projet).
#   2026-11-15b  champs de plan pose, contact et autres (atelier), facultatifs : la pose decomposee. Chaque champ rempli
#                est ajoute a la description (la pose en tete, "autres" a la fin) et verifie a part sur l'image par le controle automatique.
#                "autres" : les autres personnes VISIBLES a l'image ; vide quand elle est seule (le cas courant).
#   2026-11-15c  LoRA par defaut d'un temps : posees sur le projet ("LoRA de ce temps"), plus sur chaque scene. Elles
#                s'appliquent a toutes les scenes du temps, y compris a un plan qui ecrit "loras: []" ou sa propre liste
#                (qui s'y ajoute). Le controle des plans signale un temps 4 sans LoRA porno d'image ou de clip.
#   2026-11-15d  decoupage dit par chaque plan : "transition" (sauf premier plan) et "camera" sont obligatoires sur
#                tout plan en raccord "coupe", avec "coupe" et "fixe" pour dire qu'il ne se passe rien. Nouvelles
#                transitions : fondu_lent, filage_gauche, filage_haut, filage_bas, glisse, glisse_gauche, dezoom.
#                Nouvelles cameras : haut, bas, avance_vif, recul_vif.
#   2026-11-15e  UNE VIDEO, UN FICHIER : le bloc "atelier" n'ecrit plus "temps" ; chaque plan dit le sien ("temps: 1" a 4)
#                et les plans se suivent dans l'ordre des temps. 30 plans au plus, 10 par temps. Le fichier s'importe
#                tout seul dans la page (plus de bouton) ; redepose, il met le projet a jour. "projet_de" ne sert plus.
#                L'ancienne forme (un fichier par temps, avec "atelier.temps") reste lue.
#   2026-11-15f  bloc "atelier" : garder (facultatif). La tenue et le lieu de la continuite absents de la fiche du personnage
#                sont proposes d'office au proprietaire, une fois les images faites : rien a declarer. "garder" ne sert qu'a
#                souffler leur nom francais, ou a proposer une tenue qui n'est pas celle de la continuite.
#   2026-11-15g  POSE OBLIGATOIRE : tout plan qui a sa propre image (tous sauf un raccord "continu") remplit dans "pose"
#                les champs cadrage, angle, position et regard (deux champs nouveaux : cadrage et angle). La Production
#                les met en tete de la description, dans cet ordre. "still" ne les redit plus : il garde l'expression,
#                les objets et le detail. Quand "angle" est rempli, le "pdv" de la fiche de continuite n'est pas ajoute.
#                Gros plan au temps 1 : "still" dit ce qu'on voit de la tenue, la tenue entiere de la fiche n'est pas ajoutee.

modele: "2026-11-15g"
name: monlot                 # prefixe des fichiers produits (lettres, chiffres, _), unique par lancement

# --- Facultatif : script livre a la Production (docs/agents.md, "Livrer un script a la Production") --------------
# Uniquement pour un fichier place dans server/jobs/atelier/. Le pilote ignore ce bloc ; c'est la
# page Atelier qui le lit, et qui importe le fichier toute seule des qu'il est accepte.
# UN FICHIER PAR VIDEO : les quatre temps dans le meme fichier, chaque plan avec son "temps", dans l'ordre.
# 30 plans au plus, 10 par temps, "still" obligatoire dans chacun, pas de "character", ni de "steps", "image", "edit", "suite_de",
# "end_image" (les raccords se demandent par "raccord", l'image de reference par "reference").
# atelier:
#   projet: ""               # "" ou absent : nouvelle video, la page ouvre son projet. pNNNN : plans a verser dans ce projet.
#                            # Pas de "temps" ici : chaque plan dit le sien.
#   personnage: lea          # seulement pour un nouveau projet (fiche de persona/personnages/)
#   titre: ""                # seulement pour un nouveau projet
#   note: ""                 # une ligne pour le proprietaire, affichee dans la page
#   # Textes de publication (lus si le fichier porte des plans du temps 1). Un champ vide ou absent garde celui du projet.
#   pitch: ""                # resume de la video en une ou deux phrases, en francais
#   accroche: ""             # texte a l'ecran de la premiere seconde, langue du personnage, sans emoji
#   legende: ""              # legende de la publication, avec l'appel a l'action
#   cta: ""                  # appel a l'action du carton de fin
#   hashtags: ""
#   ambiance: ""             # fond sonore du lieu pour toute la video, une phrase en anglais, sans musique ni voix :
#                            # la piece et deux ou trois sons precis ("Quiet kitchen room tone, soft hum of a fridge,
#                            # faint birds through an open window"). Fabrique depuis la page (etape Montage, Son).
#   # Moment vecu par le personnage. Absent : celui du projet est garde.
#   date_perso: "2026-12-19" # date FICTIVE, entre guillemets, AAAA-MM-JJ : le jour ou le personnage vit la scene.
#                            # Ce n'est ni la date d'ecriture, ni celle du calcul, ni celle du depot.
#   contexte: ""             # contexte du moment, une ligne en francais (meteo, fete proche, ce qu'elle vit)
#   # Continuite du projet : ecrite une fois, elle vaut pour les quatre temps. Absente : celle du projet.
#   continuite:              # ce qui ne change pas d'une image a l'autre ; en anglais ; ajoute a la fin de chaque "still"
#     lieu: "in a small Parisian bathroom with white tiles and a round mirror"
#     tenue: "wearing a white ribbed tank top and grey cotton shorts"
#     cheveux: "hair in a loose bun"        # coiffure du jour, ou ""
#     lumiere: "soft morning window light"
#     pdv: "shot at eye level on a phone"   # point de vue : la vue, jamais l'appareil comme un objet pose
#   # Facultatif. Une tenue ou un lieu nouveau de la continuite est propose d'office au proprietaire, qui seul l'ajoute a la
#   # fiche du personnage. Ce bloc sert a souffler son nom francais ("francais | anglais", l'anglais mot pour mot comme
#   # dans la continuite), ou a proposer une tenue qui n'est pas celle de la continuite. 4 lignes au plus par liste.
#   garder:
#     tenues: ["robe rouge a fines bretelles | wearing a red slip dress with thin straps"]
#     lieux: []
#   reference: plan01        # nom d'un plan du temps 1 de ce fichier : les autres images du projet en sont tirees par retouche

# --- Facultatif : autre personnage que celui de persona/production.yaml --------------------------
# Un champ absent garde la valeur de production.yaml. Bloc a supprimer pour Lea.
# character:
#   name: "Prenom Nom"
#   zimage_prefix: "declencheur, a woman with ..., "   # debut de chaque description
#   lora_still_zimage: "fichier.safetensors"           # LoRA du visage, present sur le volume
#   lora_still_zimage_strength: 1.4
#   zimage_tattoos: ""                                 # "" si le LoRA porte deja les tatouages
#   zimage_body: ""                                    # redige par le proprietaire uniquement

# --- Reglages communs a tous les plans (chacun peut etre repris dans un plan) ---------------------
defaults:
  still_size: [720, 1280]    # largeur, hauteur de l'image ; [864, 1152] pour une photo seule
  clip_size: [480, 832]      # 480p pour les essais ; [720, 1280] coute environ quatre fois plus
  seed: 100                  # tirage ; chaque plan ajoute son rang, sauf same_seed: true
  same_seed: false           # true : meme tirage pour tous les plans (comparaisons)
  char_strength: 1.4         # force du LoRA du personnage (1,2 a 1,4 ; en dessous, l'identite faiblit)
  loras: []                  # LoRA supplementaires : [nom] ou [{name: nom, strength: 0.6}] ; voir "pilot lora list". Image ou video (clip).
                             # Plan depose dans l'atelier : les LoRA par defaut du temps s'y ajoutent d'office (reglees par le proprietaire).
  mode: natural              # rendu du clip : natural (qualite) ou fast (4 pas, essais de mouvement)
  smooth: true               # interpolation a 32 images/s
  grain: true                # leger grain, moins "image de synthese"

shots:
  # 1. Image seule.
  - name: img01
    still: "expression, objets, detail : une phrase en anglais (dans l'atelier, le cadrage et la pose vont dans pose)"
    tattoos: true            # false si la tenue couvre epaules et poitrine (pull, peignoir ferme)
    # Lus par l'atelier seulement (ignores par le pilote) :
    # temps: 1               # OBLIGATOIRE dans un fichier depose : 1 accroche tous publics, 2 montee suggestive,
    #                        # 3 devoile (nudite, sans acte), 4 final prive. Les plans se suivent dans l'ordre des temps ;
    #                        # chaque temps est une video a part (son premier plan n'a pas de "transition").
    # titre: "Regard"        # nom de la scene dans la page
    # texte: "Don't blink."  # texte incruste au montage
    # voix: ""               # voix off (pas encore produite)
    # son: ""                # bruit du geste, en anglais : UN son bref et concret, de pres, avec la matiere
    #                        # ("a ceramic cup set down on a wooden counter"). Vide si le geste est silencieux.
    # role: montee           # accroche, montee ou chute
    # raccord: coupe         # lien avec le plan precedent du meme temps : coupe (defaut, le plan a sa propre image),
    #                        # continu (pas d'image propre : le clip part de la derniere image du clip precedent et le
    #                        # montage les colle sans coupe ; "still" reste obligatoire et decrit l'image attendue),
    #                        # arrivee (le clip precedent se termine sur l'image de ce plan ; cout double pour lui)
    # transition: coupe      # OBLIGATOIRE sur tout plan en raccord coupe, sauf le premier : comment on arrive sur ce plan.
    #                        # coupe (franche, le cas courant) ; fondu (le temps passe) ; fondu_lent (longue pause) ;
    #                        # filage, filage_gauche, filage_haut, filage_bas (la camera part tres vite vers la droite,
    #                        # la gauche, le haut, le bas : autre lieu, autre angle, autre moment) ; glisse, glisse_gauche
    #                        # (le meme passage, lent : moment calme) ; zoom (avancee rapide : arriver sur un plan plus
    #                        # serre) ; dezoom (recul rapide : arriver sur un plan plus large)
    # camera: fixe           # OBLIGATOIRE sur tout plan en raccord coupe : ce que fait la camera pendant le plan,
    #                        # fabrique au montage. fixe ; avance, recul, gauche, droite, haut, bas (lent, sur tout le
    #                        # plan) ; avance_vif, recul_vif (d'un coup, au debut du plan). A ne pas ecrire sur un plan
    #                        # en raccord continu ou arrivee (le mouvement du premier plan du groupe se prolonge)
    # libre: false           # true : autre lieu ou autre tenue, sans la fiche de continuite ni l'image de reference
    # cran: 1                # niveau du plan dans la progression du temps, de 1 (anodin) a 5 (le plus ose de ce temps) ;
    #                        # il ne redescend pas d'un plan au suivant (verifie par le controle des plans)
    # pose:                  # OBLIGATOIRE dans un fichier depose (sauf raccord continu) : la pose decomposee, en anglais,
    #                        # une courte phrase par champ, jamais redite dans "still". cadrage, angle, position et
    #                        # regard sont obligatoires ; les autres champs seulement s'ils comptent pour ce plan.
    #                        # La Production les place en tete de la description, dans cet ordre, et chaque champ est
    #                        # verifie a part sur l'image (verifier.py --notes). Sans eux, le modele d'image rend
    #                        # toujours la meme photo : de face, a la taille, les yeux dans l'objectif.
    #   cadrage: "medium shot"                   # OBLIGATOIRE. wide shot, full body shot, medium shot... Gros plan :
    #                                            # dire ce qui remplit l'image et ou elle est coupee ("extreme close-up
    #                                            # portrait, her face fills the frame, cropped just below the
    #                                            # collarbones") ; "close-up" seul rend un plan a la taille.
    #   angle: "from a three-quarter side angle" # OBLIGATOIRE. D'ou la camera la voit : "shot straight on at chest
    #                                            # height", "from behind", "from above", "from a low angle"...
    #   position: "sitting cross-legged on the mat"   # OBLIGATOIRE. La position d'ensemble, jambes comprises
    #                                            # ("sits" seul ne suffit pas)
    #   appui: "weight on her left forearm"      # sur quoi le corps repose
    #   bassin: "hips turned to the camera"
    #   genoux: "knees together"
    #   mains: "right hand in her hair"
    #   regard: "head turned to the left, eyes looking away toward the window, not looking at the camera"
    #                                            # OBLIGATOIRE. La tete ET les yeux ; si elle ne regarde pas l'objectif,
    #                                            # l'ecrire ("not looking at the camera"). Visage hors cadre : le dire.
    # contact: ""            # ce que son corps touche et ou ("her cheek against the pillow")
    # autres: ""             # les autres personnes VISIBLES a l'image : qui, ou, quelle partie du corps. Laisser vide
    #                        # quand elle est seule a l'image (le cas courant, meme si quelqu'un est suppose hors champ) :
    #                        # le controle signale alors toute autre personne.

  # 2. Image puis clip de 5 s : un seul geste lent, phrase en anglais commencant par "She".
  - name: clip01
    still: "..."
    motion: "She slowly smiles and tilts her head, looking at the camera."

  # 3. Clip debut/fin : le changement de pose est impose par une image de fin fabriquee a partir de
  #    la premiere. Cout double. A reserver aux vrais changements de pose (assise puis debout).
  - name: clip02
    still: "..."
    end_edit: "her pose: she is now standing upright, facing the camera."
    motion: "She stands up in one smooth motion and faces the camera."

  # 4. Enchainement : plusieurs clips a la suite, chacun partant de la fin du precedent.
  - name: clip03
    still: "..."
    steps:
      - {end: "her pose: ...", motion: "She ..."}
      - {end: "her pose: ...", motion: "She ..."}

  # 5. Clip a partir d'une image deja produite et validee (pas de nouveau tirage).
  #    Chemin relatif au dossier de donnees (server/data) ou absolu dans le conteneur (/data/...).
  - name: clip04
    image: "inbox/monlot_img01.png"
    motion: "She ..."

  # 6. Image tiree d'une image existante par retouche : meme personne, meme lieu, meme tenue, nouvelle pose.
  #    "edit" remplace "still" ; il decrit toute l'image voulue. Pas de LoRA supplementaire.
  - name: img02
    image: "inbox/monlot_img01.png"
    edit: "medium shot, she leans on the sink and looks at the camera over her shoulder, amused"
    # tenue_libre: true   # la tenue n'est pas gardee : elle est celle que decrit "edit" (elle se defait d'un plan a l'autre)

  # Pose imposee (champ de pilote "squelette: true", pose par la Production, jamais par un script) : pour un plan qui
  # a son "still", le pilote tire d'abord un brouillon de la scene, en dessine le squelette et cree l'image dessus.
  # La position du corps et le cadrage ecrits sont tenus ; rien ne change dans l'ecriture d'un plan.

  # 7. Clip continu : il part de la derniere image du clip d'un plan place avant lui dans le meme fichier.
  #    Les deux clips se montent bout a bout sans coupe visible. La derive s'accumule : deux de suite au plus.
  - name: clip05
    suite_de: clip01
    motion: "She ..."

  # 8. Clip qui se termine sur une image existante (clip debut/fin, cout double).
  - name: clip06
    still: "..."
    end_image: "inbox/monlot_img02.png"
    motion: "She ..."

  # Champs reserves au proprietaire : body (description du corps) et dest (abonnes, payant).
  # Un agent ne les renseigne pas.
