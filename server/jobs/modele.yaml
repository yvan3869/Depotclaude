# MODELE DE FICHIER DE PLANS : reference en cours de validite.
# Tout plan s'ecrit en copiant ce fichier, puis en retirant ce qui ne sert pas. Ce modele est tenu a
# jour a chaque evolution du pilote ; les autres fichiers de ce dossier sont des exemples dates, qui
# peuvent etre en retard. Ne pas lancer ce fichier tel quel.
#
# La ligne "modele" ci-dessous est a recopier sans la changer : le pilote la compare a sa propre
# version et previent dans son journal si le plan a ete ecrit d'apres un modele perime.
#
# Historique
#   2026-11-14   premiere version : champs character, image, tattoos, body, end_edit, steps.
#   2026-11-14b  depot dans l'atelier : bloc "atelier", champs de plan titre, texte, voix, role.
#   2026-11-14c  bloc "atelier" : textes de publication du temps 1 (pitch, accroche, legende, cta, hashtags).
#   2026-11-14d  bloc "atelier" : date du personnage (date_perso, fictive) et contexte du moment, avec le temps 1.
#   2026-11-14e  continuite : bloc "atelier" continuite et reference, champs de plan raccord, libre et cran (atelier) ;
#                champs de plan edit, suite_de et end_image (pilote).
#   2026-11-14f  quatre temps : "atelier.temps" va de 1 a 4. Le 3 est maintenant le devoile (nudite, sans acte) et le
#                final prive passe en 4. Un plan depose avec un modele plus ancien et temps: 3 est lu comme temps: 4.
#                "loras" absent d'un plan depose : l'atelier pose les LoRA par defaut du temps ; "loras: []" : aucune.

modele: "2026-11-14f"
name: monlot                 # prefixe des fichiers produits (lettres, chiffres, _), unique par lancement

# --- Facultatif : plans deposes dans l'atelier (docs/agents.md, "Deposer des plans") --------------
# Uniquement pour un fichier place dans server/jobs/atelier/. Le pilote ignore ce bloc ; c'est la
# page Atelier qui le lit quand le proprietaire importe le fichier. Dans ce cas : 1 a 10 plans,
# "still" obligatoire dans chacun, pas de "character", ni de "steps", "image", "edit", "suite_de",
# "end_image" (les raccords se demandent par "raccord", l'image de reference par "reference").
# atelier:
#   projet: p0001            # projet auquel ajouter les plans ; "" ou absent : nouveau projet
#   temps: 3                 # 1 accroche tous publics, 2 montee suggestive, 3 devoile (nudite, sans acte), 4 final prive
#   personnage: lea          # seulement pour un nouveau projet (fiche de persona/personnages/)
#   titre: ""                # seulement pour un nouveau projet
#   note: ""                 # une ligne pour le proprietaire, affichee dans la page
#   # Textes de publication, lus seulement avec temps: 1. Un champ vide ou absent garde celui du projet.
#   pitch: ""                # resume de la video en une ou deux phrases, en francais
#   accroche: ""             # texte a l'ecran de la premiere seconde, langue du personnage, sans emoji
#   legende: ""              # legende de la publication, avec l'appel a l'action
#   cta: ""                  # appel a l'action du carton de fin
#   hashtags: ""
#   # Moment vecu par le personnage, lu seulement avec temps: 1. Absent : celui du projet est garde.
#   date_perso: "2026-12-19" # date FICTIVE, entre guillemets, AAAA-MM-JJ : le jour ou le personnage vit la scene.
#                            # Ce n'est ni la date d'ecriture, ni celle du calcul, ni celle du depot.
#   contexte: ""             # contexte du moment, une ligne en francais (meteo, fete proche, ce qu'elle vit)
#   # Continuite du projet, lue seulement avec temps: 1 (elle vaut pour les quatre temps). Absente : celle du projet.
#   continuite:              # ce qui ne change pas d'une image a l'autre ; en anglais ; ajoute a la fin de chaque "still"
#     lieu: "in a small Parisian bathroom with white tiles and a round mirror"
#     tenue: "wearing a white ribbed tank top and grey cotton shorts"
#     cheveux: "hair in a loose bun"        # coiffure du jour, ou ""
#     lumiere: "soft morning window light"
#     pdv: "shot at eye level on a phone"   # point de vue de la camera
#   reference: plan01        # nom d'un plan de ce fichier : les autres images du projet en sont tirees par retouche

# --- Facultatif : autre personnage que celui de persona/production.yaml --------------------------
# Un champ absent garde la valeur de production.yaml. Bloc a supprimer pour Lea.
# character:
#   name: "Prenom Nom"
#   zimage_prefix: "declencheur, a woman with ..., "   # debut de chaque description
#   lora_still_zimage: "fichier.safetensors"           # LoRA du visage, present sur le volume
#   lora_still_zimage_strength: 1.4
#   zimage_tattoos: ""                                 # "" si le LoRA porte deja les tatouages
#   zimage_body: ""                                    # redige par le proprietaire uniquement

# --- Reglages communs a tous les plans (chacun peut etre repris dans un plan) ---------------------
defaults:
  still_size: [720, 1280]    # largeur, hauteur de l'image ; [864, 1152] pour une photo seule
  clip_size: [480, 832]      # 480p pour les essais ; [720, 1280] coute environ quatre fois plus
  seed: 100                  # tirage ; chaque plan ajoute son rang, sauf same_seed: true
  same_seed: false           # true : meme tirage pour tous les plans (comparaisons)
  char_strength: 1.4         # force du LoRA du personnage (1,2 a 1,4 ; en dessous, l'identite faiblit)
  loras: []                  # LoRA supplementaires : [nom] ou [{name: nom, strength: 0.6}] ; voir "pilot lora list".
                             # Plan depose dans l'atelier : retirer la ligne pour recevoir les LoRA par defaut du temps.
  mode: natural              # rendu du clip : natural (qualite) ou fast (4 pas, essais de mouvement)
  smooth: true               # interpolation a 32 images/s
  grain: true                # leger grain, moins "image de synthese"

shots:
  # 1. Image seule.
  - name: img01
    still: "cadrage, lieu, tenue, pose, expression, lumiere : une phrase dense en anglais"
    tattoos: true            # false si la tenue couvre epaules et poitrine (pull, peignoir ferme)
    # Lus par l'atelier seulement (ignores par le pilote), tous facultatifs :
    # titre: "Regard"        # nom de la scene dans la page
    # texte: "Don't blink."  # texte incruste au montage
    # voix: ""               # voix off (pas encore produite)
    # role: montee           # accroche, montee ou chute
    # raccord: coupe         # lien avec le plan precedent du meme temps : coupe (defaut, le plan a sa propre image),
    #                        # continu (pas d'image propre : le clip part de la derniere image du clip precedent et le
    #                        # montage les colle sans coupe ; "still" reste obligatoire et decrit l'image attendue),
    #                        # arrivee (le clip precedent se termine sur l'image de ce plan ; cout double pour lui)
    # libre: false           # true : autre lieu ou autre tenue, sans la fiche de continuite ni l'image de reference
    # cran: 1                # niveau du plan dans la progression du temps, de 1 (anodin) a 5 (le plus ose de ce temps) ;
    #                        # il ne redescend pas d'un plan au suivant (verifie par le controle des plans)

  # 2. Image puis clip de 5 s : un seul geste lent, phrase en anglais commencant par "She".
  - name: clip01
    still: "..."
    motion: "She slowly smiles and tilts her head, looking at the camera."

  # 3. Clip debut/fin : le changement de pose est impose par une image de fin fabriquee a partir de
  #    la premiere. Cout double. A reserver aux vrais changements de pose (assise puis debout).
  - name: clip02
    still: "..."
    end_edit: "her pose: she is now standing upright, facing the camera."
    motion: "She stands up in one smooth motion and faces the camera."

  # 4. Enchainement : plusieurs clips a la suite, chacun partant de la fin du precedent.
  - name: clip03
    still: "..."
    steps:
      - {end: "her pose: ...", motion: "She ..."}
      - {end: "her pose: ...", motion: "She ..."}

  # 5. Clip a partir d'une image deja produite et validee (pas de nouveau tirage).
  #    Chemin relatif au dossier de donnees (server/data) ou absolu dans le conteneur (/data/...).
  - name: clip04
    image: "inbox/monlot_img01.png"
    motion: "She ..."

  # 6. Image tiree d'une image existante par retouche : meme personne, meme lieu, meme tenue, nouvelle pose.
  #    "edit" remplace "still" ; il decrit toute l'image voulue. Pas de LoRA supplementaire.
  - name: img02
    image: "inbox/monlot_img01.png"
    edit: "medium shot, she leans on the sink and looks at the camera over her shoulder, amused"

  # 7. Clip continu : il part de la derniere image du clip d'un plan place avant lui dans le meme fichier.
  #    Les deux clips se montent bout a bout sans coupe visible. La derive s'accumule : deux de suite au plus.
  - name: clip05
    suite_de: clip01
    motion: "She ..."

  # 8. Clip qui se termine sur une image existante (clip debut/fin, cout double).
  - name: clip06
    still: "..."
    end_image: "inbox/monlot_img02.png"
    motion: "She ..."

  # Champs reserves au proprietaire : body (description du corps) et dest (abonnes, payant).
  # Un agent ne les renseigne pas.
