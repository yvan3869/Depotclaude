# Trace de ceinture a la taille : force du LoRA de Lea 1,4 / 1,2 / 1,0 a seed constante.
# Tenues qui laissent la taille nue (tous publics a suggestif).
# Lancer :  docker compose run --rm pilot run jobs/test_ceinture.yaml --stills-only
name: ceinture
defaults:
  still_size: [864, 1152]
  seed: 100
  same_seed: true
