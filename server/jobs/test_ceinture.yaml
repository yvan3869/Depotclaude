  - {name: a_brassiere_10, char_strength: 1.0, still: "medium shot, standing in a bright pilates studio, black sports bra and low-rise black shorts, bare midriff, looking at the camera, soft daylight"}
  - {name: b_bikini_14, char_strength: 1.4, still: "medium shot, standing on a sunny beach, simple white bikini, bare midriff, slight smile, looking at the camera, natural light"}
  - {name: b_bikini_12, char_strength: 1.2, still: "medium shot, standing on a sunny beach, simple white bikini, bare midriff, slight smile, looking at the camera, natural light"}
