# Pile du projet sur le serveur Oracle. Servie uniquement sur l'adresse Tailscale.
# Reseau "host" : le service ecoute directement sur l'adresse Tailscale, sans NAT Docker
# (le NAT etait bloque par le pare-feu du serveur pour le trafic venant de Tailscale).
services:
  # Studio : tri, plan, test. Meme image que le pilote, car la page Test lance le pilote elle-meme.
  # Apres une mise a jour :  docker compose up -d --build triage
  triage:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    restart: unless-stopped
    network_mode: host
    working_dir: /repo/tools/triage
    entrypoint: ["python", "-u", "triage.py", "--dir", "/data/inbox", "--host", "${TS_IP:?definir TS_IP dans .env}", "--port", "8790"]
    environment:
      TRIAGE_TOKEN: ${TRIAGE_TOKEN:?definir TRIAGE_TOKEN dans .env}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}  # hub : recherche et chargement des LoRA retenues
      REPO_DIR: /repo
      DATA_DIR: /data
    volumes:
      - ..:/repo:ro
      - ${DATA_DIR:-./data}:/data

  # Pilote GPU : ne tourne pas en permanence. Lancement :
  #   docker compose run --rm pilot run jobs/exemple.yaml
  pilot:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    profiles: ["outils"]
    environment:
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      DATA_DIR: /data
    volumes:
      - ..:/repo:ro
      - ${DATA_DIR:-./data}:/data
