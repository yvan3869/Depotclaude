# Pile du projet sur le serveur Oracle. Servie uniquement sur l'adresse Tailscale.
# Reseau "host" : le service ecoute directement sur l'adresse Tailscale, sans NAT Docker
# (le NAT etait bloque par le pare-feu du serveur pour le trafic venant de Tailscale).
services:
  triage:
    image: python:3.13-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["python", "-u", "triage.py", "--dir", "/data/inbox", "--host", "${TS_IP:?definir TS_IP dans .env}", "--port", "8790"]
    environment:
      TRIAGE_TOKEN: ${TRIAGE_TOKEN:?definir TRIAGE_TOKEN dans .env}
    volumes:
      - ../tools/triage:/app:ro
      - ${DATA_DIR:-./data}:/data

  # Pilote GPU : ne tourne pas en permanence. Lancement :
  #   docker compose run --rm pilot run jobs/exemple.yaml
  pilot:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    profiles: ["outils"]
    environment:
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      DATA_DIR: /data
    volumes:
      - ..:/repo:ro
      - ${DATA_DIR:-./data}:/data
