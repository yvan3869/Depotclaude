  lora_still_zimage_strength: 1.4
  zimage_prefix: "leamorel, a woman with wavy shoulder-length auburn hair with copper highlights and green eyes, "
  zimage_tattoos: ""         # laisse vide : les tatouages viennent du LoRA
  # Description fixe du corps, a rediger par le proprietaire (en anglais, terminee par ", ").
  # Toujours la meme phrase, au mot pres : c'est ce qui garde les formes constantes d'une image a
  # l'autre. Ajoutee seulement aux plans dont la destination est listee dans zimage_body_dests
